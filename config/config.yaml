project:
  name: "Public-Data Sector Rotation Decision Support System"
  name_en: "Public-Data Sector Rotation Decision Support System"
  subtitle: "Cross-sectional ranking of Shenwan L1 industries using public data"

data:
  start_date: "2015-01-01"
  end_date: "2026-06-30"
  start_year: 2015
  end_year: 2026
  tushare_token: ""

paths:
  raw: "data/raw"
  processed: "data/processed"
  figures: "data/figures"

# ---------------------------------------------------------------------------
# 精选特征（控制总维度 ~60-80；见 src/data/feature_selection.py）
# ---------------------------------------------------------------------------
features:
  core_required:
    - PMI
    - CPI
    - PPI
    - M2
    - TSF
    - MARGIN_BAL
    - NORTH_FLOW
    - TURNOVER
    - HS300_VOL
    - HS300_TREND_3M
    - HS300_TREND_6M
    - MARKET_BREADTH
    - CYB_VS_HS300
    - VOL_TREND
    - IND_MOM_1M
    - IND_MOM_3M
    - IND_MOM_6M
    - IND_REV_1M
    - IND_DISP_1M

  required_for_master: []

  optional_extended: []  # extended series fetched but not used in default ML set

  clustering_cols: "all"

# Publication / release lag (months). Effective lag = max(feature_lags, release_lags).
publication_release_lags:
  PMI: 1
  CPI: 1
  PPI: 1
  M2: 1
  TSF: 1
  IND_PROD: 2
  RETAIL: 2
  BOND_10Y: 1
  MARGIN_BAL: 1
  NORTH_FLOW: 1

# 行业可比性（第三优先级）
industry:
  training_start_date: "2020-01-01"
  exclude_from_training: ["石油石化", "环保", "美容护理"]
  truncate_late_start: true
  mask_missing_in_rotation: true
  comparable_min_obs_ratio: 0.85

market_state:
  chinext_symbol: "sz399006"

feature_lags:
  _default: 1
  PMI: 1
  CPI: 1
  PPI: 1
  M2: 1
  TSF: 1
  MARGIN_BAL: 1
  NORTH_FLOW: 1
  TURNOVER: 1
  HS300_VOL: 1
  HS300_TREND_3M: 1
  HS300_TREND_6M: 1
  MARKET_BREADTH: 1
  CYB_VS_HS300: 1
  VOL_TREND: 1
  MARGIN_CHG: 1
  IND_MOM_1M: 1
  IND_MOM_3M: 1
  IND_MOM_6M: 1
  IND_REV_1M: 1
  IND_DISP_1M: 1
  IND_PROD: 2
  RETAIL: 2
  BOND_10Y: 1
  MARGIN_CHG: 1
  TURNOVER_ZSCORE: 1
  HS300_MA20_GAP: 1

# 兼容旧配置
macro_publication_lag:
  PMI: 1
  CPI: 1
  PPI: 1
  M2: 1
  TSF: 1

benchmark:
  symbol: "sh000300"
  name: "HS300"
  csi500_symbol: "sh000905"
  csi500_name: "CSI500"

backtest:
  subperiods:
    "2020-2021": ["2020-01-01", "2022-01-01"]
    "2022": ["2022-01-01", "2023-01-01"]
    "2023": ["2023-01-01", "2024-01-01"]
    "2024": ["2024-01-01", "2025-01-01"]
    "2025": ["2025-01-01", "2026-01-01"]

regime:
  min_industry_obs: 60

  quadrant:
    growth_indicator: PMI
    inflation_indicator: CPI
    growth_threshold: 50.0
    inflation_threshold_method: median

  clustering:
    n_clusters: 4
    random_state: 42

  comparison:
    recent_split: "2020-01-01"

strategy:
  top_n: 5
  min_regime_obs: 3
  min_industry_obs: 48
  min_industry_obs_in_regime: 2
  risk_free_rate: 0.02

robustness:
  k_values: [3, 4, 5]
  rolling_window: 48
  post_2022_split: "2022-01-01"
  market_phases:
    "2016-2019": ["2016-01-01", "2020-01-01"]
    "2020-2021": ["2020-01-01", "2022-01-01"]
    "2022-2025": ["2022-01-01", "2026-01-01"]

# ---------------------------------------------------------------------------
# 监督学习建模（主策略路径）
# ---------------------------------------------------------------------------
ml:
  min_train_months: 36
  min_industry_obs: 48
  top_k: 5
  use_zscore: true
  use_industry_id: true
  modeling_mode: panel
  transaction_cost_oneway: 0.0015
  random_state: 42
  interpretability_model: xgboost
  ablation_model: xgboost
  run_interpretability: true
  run_ablation: true
  regression_models:
    - ridge
    - lasso
    - random_forest
    - lightgbm
    - xgboost
  ranking_models:
    - lambdarank
  ridge_alpha: 1.0
  lasso_alpha: 0.001
  random_forest_n_estimators: 200
  random_forest_max_depth: 6
  random_forest_min_samples_leaf: 5
  lightgbm_n_estimators: 200
  lightgbm_learning_rate: 0.05
  lightgbm_num_leaves: 15
  xgboost_n_estimators: 200
  xgboost_learning_rate: 0.05
  xgboost_max_depth: 4
  rank_n_estimators: 200
  rank_learning_rate: 0.05
  rank_num_leaves: 15

  # Primary research path: Ranking → LambdaRank → Top-K → Rank IC
  primary_model: lambdarank
  primary_experiment: ranking
  model_selection_metric: rank_ic_mean

  validation:
    enabled: true
    val_months: 12
    n_estimators_grid: [100, 200, 300]
    learning_rate_grid: [0.03, 0.05, 0.1]
    num_leaves_grid: [15, 31]

  feature_selection:
    corr_threshold: 0.85
    top_n: 35

  case_study:
    n_dates: 3

  risk_control:
    default_weighting: softmax
    softmax_temperature: 1.0
    max_industry_weight: 0.20
    portfolio_weightings:
      - softmax
      - equal
      - vol_adjusted
      - risk_parity
    turnover_penalty_grid:
      - 0.0
      - 0.05
      - 0.1
      - 0.2
    turnover_penalty_lambda: 0.0

  stability:
    enabled: true
    top_k_grid: [3, 5, 10]
    horizon_grid: [1, 2, 3]
    train_windows:
      - mode: expanding
        label: Expanding
      - mode: rolling
        window: 36
        label: Rolling 36M
      - mode: rolling
        window: 60
        label: Rolling 60M
